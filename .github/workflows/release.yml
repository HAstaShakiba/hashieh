name: Release

# Push a tag like v0.1.1 whose number matches hashieh/__init__.py to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' hashieh/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            gnome-settings-daemon-common gnome-shell-common gsettings-desktop-schemas

      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -t .

      - name: Build packages
        run: packaging/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="packaging/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Hashieh ${GITHUB_REF_NAME#v}" "$@"

  desktop:
    needs: release
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: write

  checksums:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checksums for every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern 'hashieh*' --pattern 'Hashieh*'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
