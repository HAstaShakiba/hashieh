[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hashieh"
dynamic = ["version"]
description = "A notes panel on the edge of your screen, compatible with SideNotes (macOS) data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
# PyGObject, pycairo and GTK 3 come from the system (python3-gi, python3-gi-cairo, gir1.2-gtk-3.0).
dependencies = []

[project.scripts]
hashieh = "hashieh.__main__:main"

[project.urls]
Homepage = "https://github.com/HAstaShakiba/hashieh"

[tool.setuptools]
packages = ["hashieh"]

[tool.setuptools.dynamic]
version = { attr = "hashieh.__version__" }
